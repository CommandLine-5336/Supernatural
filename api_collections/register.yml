info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8080/register?email=johndoe@email.com&password=strong-password
  params:
    - name: email
      value: johndoe@email.com
      type: query
    - name: password
      value: strong-password
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
