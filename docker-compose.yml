services:
  database:
    container_name: database
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  seaweedfs:
    container_name: seaweedfs
    image: chrislusf/seaweedfs:4.40
    command: server -s3 -s3.config=/etc/seaweedfs/s3config.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./general/seaweedfs-config/s3config.json:/etc/seaweedfs/s3config.json

  general:
    container_name: general
    build: ./general
    env_file:
      - .env
    command: >
      sh -c "sleep 10 && python manage.py makemigrations authentication blocking posts promotion &&
      python manage.py migrate &&
      python manage.py runserver"
    volumes:
      - ./general:/app
      - /app/.venv
    ports:
      - "4040:4040"
    depends_on:
      database:
        condition: service_healthy

  auth:
    container_name: auth
    build: ./auth
    env_file: .env
    ports:
      - "8100:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8080:8080"
    depends_on:
      - general
    restart: unless-stopped

  db_backup:
    container_name: db_backup
    build:
      context: ./general
      dockerfile: Dockerfile.backup
    env_file:
      - .env
    environment:
        POSTGRES_HOST : ${DB_HOST}
        POSTGRES_USER : ${DB_USER}
        POSTGRES_PASSWORD : ${DB_PASS}
        POSTGRES_DB : ${DB_NAME}
    volumes:
      - ./db_backups:/db_backups
      - ./backup.sh:/backup.sh
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  mail_service:
    container_name: mail_service
    build: ./mail_sending
    env_file: .env
    ports:
      - "8074:8074"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgresql_data:
  db_backups:
  seaweedfs_data:
