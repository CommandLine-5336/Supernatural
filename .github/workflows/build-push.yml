---
name: Build & Push Docker Images into ECR

on:
  workflow_dispatch:
  push:

jobs:
  build-tag-push-image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dir:
          - action_test
          - action_test2
          - action_test3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: ${{ matrix.dir }}/**


      - name: Configure AWS Credentials
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
            aws-region: us-east-1
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login into ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image to ECR
        id: build-image
        working-directory: ${{ matrix.dir }}
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: supernatural
            IMAGE_TAG: ${{ github.sha }}
            DIR_NAME: ${{ matrix.dir }}
            TAG_PREFIX: ${{ github.ref == 'refs/heads/main' && 'dev' || 'test' }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_PREFIX-$DIR_NAME-$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_PREFIX-$DIR_NAME-$IMAGE_TAG
