---
name: Build & Push Docker Images into ECR

on:
  workflow_dispatch:
  push:

jobs:
  build-tag-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        dir:
          - action_test
          - action_test2
          - action_no_existing_folder
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0    #checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 #changed-files@v47
        with:
          files: ${{ matrix.dir }}/**

      - name: Force success if no file changes
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Folder ${{ matrix.dir }} wasn't changed"
          exit 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d #configure-aws-credentials@v6
        with:
            aws-region: us-east-1
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login into ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  #amazon-ecr-login@v2

      - name: Build, Tag and Push Image to ECR
        id: build-image
        working-directory: ${{ matrix.dir }}
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: supernatural
            IMAGE_TAG: ${{ github.sha }}
            DIR_NAME: ${{ matrix.dir }}
            TAG_PREFIX: ${{ github.ref == 'refs/heads/main' && 'dev' || 'test' }} # if we in main branch taf is dev, else tag is test
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG_PREFIX-$DIR_NAME-$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG_PREFIX-$DIR_NAME-$IMAGE_TAG"
