---
name: Build & Push Docker Images into ECR

on:
  workflow_dispatch:
  push:

jobs:
  find-out-changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v35
        with:
          dir_names: true
          matrix: true

  build-tag-push-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{fromJson(needs.find-out-changes.outputs.dirs)}}
    needs:
      - find-out-changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
            aws-region: us-east-1
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login into ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image to ECR
        id: build-image
        working-directory: ${{ matrix.dir }}
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: supernatural
            IMAGE_TAG: ${{ github.sha }}
            TAG_PREFIX: ${{ github.ref == 'refs/heads/main' && 'dev' || 'test' }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_PREFIX-$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TAG_PREFIX-$IMAGE_TAG
