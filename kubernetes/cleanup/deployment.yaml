#Dont know about ServiceAccountName for now....
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanup-deployment
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cleanup
  template:
    metadata:
      labels:
        app: cleanup
      annotations:
        consul.hashicorp.com/connect-inject: 'true'
    spec:
      containers:
        - name: cleanup
          image: 704427427594.dkr.ecr.us-east-1.amazonaws.com/cleanup:test_cleanup_v.262
          ports:
            - containerPort: 8585
          envFrom:
            - secretRef:
                name: cleanup-secret
          resources:
            requests:
             cpu: "150m"
             memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8585
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
             path: /health
             port: 8585
            initialDelaySeconds: 10
            periodSeconds: 15


