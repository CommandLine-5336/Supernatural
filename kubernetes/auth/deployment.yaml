apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        consul.hashicorp.com/connect-inject: 'true'
        consul.hashicorp.com/connect-service: 'auth'
    spec:
      serviceAccountName: auth
      containers:
        - name: auth
          image: 704427427594.dkr.ecr.us-east-1.amazonaws.com/auth:test_auth_v.257
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: auth-secret
