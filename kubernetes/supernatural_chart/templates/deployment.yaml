{{- range .Values.services  }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .nameDeployment }}
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .appLabel }}
      env: {{ $.Values.global.env }}
  template:
    metadata:
      labels:
        app: {{ .appLabel }}
        env: {{ $.Values.global.env }}
      {{- if .isPartOfConsul }}
      annotations:
        consul.hashicorp.com/connect-inject: 'true'
        consul.hashicorp.com/connect-service: '{{ .connectService }}'
      {{- end }}
    spec:
      serviceAccountName: {{ .serviceAccountName }}
      containers:
        - name: {{ .containerName }}
          image: {{ .image }}
          {{- if ne .appLabel "password-generator" }}
          ports:
            - containerPort: {{ .containerPort }}
          {{- end }}
          {{- if eq .appLabel "general" }}
          env:
            - name: POD_IP
              valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .nameSecret }}
          resources:
            requests:
             cpu: "150m"
             memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          {{- if .getCheck }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
             path: /health
             port: {{ .containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- end }}
{{- end }}
