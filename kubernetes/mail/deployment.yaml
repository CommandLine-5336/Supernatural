apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
      annotations:
        consul.hashicorp.com/connect-inject: 'true'
    spec:
      containers:
        - name: mail
          image: 704427427594.dkr.ecr.us-east-1.amazonaws.com/mail_sending:test_mail_sending_v.259
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: mail-secret
